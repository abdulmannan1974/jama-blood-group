<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JAMA self-test</title><style>
/* Layout: magazine spread. Wide hero with faded red cells, two-column narrative, floated figures, pull quotes, full-width evidence chain. */
:root{
  --bg:#FAF9F5; --fg:#141413; --muted:#5E5D57; --faint:#87867F;
  --clay:#D97757; --clay-ink:#B85C3E; --oat:#E3DACC; --olive:#788C5D; --rust:#B04A3F;
  --panel:#F0EEE6; --line:#D1CFC5; --card:#FFFFFF; --cell:#C9503F; --cell-soft:#E9A796;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1B18; --fg:#ECE9E0; --muted:#B5B2A8; --faint:#8F8C84;
  --clay:#E48B6C; --clay-ink:#EBA084; --oat:#3A352D; --olive:#9DB27F; --rust:#DC7A6C;
  --panel:#26251F; --line:#46443D; --card:#23221E; --cell:#D8604E; --cell-soft:#7A3A30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1B18; --fg:#ECE9E0; --muted:#B5B2A8; --faint:#8F8C84;
  --clay:#E48B6C; --clay-ink:#EBA084; --oat:#3A352D; --olive:#9DB27F; --rust:#DC7A6C;
  --panel:#26251F; --line:#46443D; --card:#23221E; --cell:#D8604E; --cell-soft:#7A3A30; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.65;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:24px;padding-block:0 120px}
@media (max-width:480px){.wrap{padding-inline:16px}}
h1,h2,h3{font-family:var(--serif);font-weight:500;text-wrap:balance;margin:0}
h2{font-size:30px;line-height:1.2}
h3{font-size:20px;line-height:1.3;margin-bottom:8px}
p{margin:0 0 1em}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--clay-ink)}
.mono{font-family:var(--mono);font-size:.9em}
em.gene{font-style:italic}
a{color:var(--clay-ink)}
:focus-visible{outline:2px solid var(--clay);outline-offset:3px}

/* Hero */
.hero{position:relative;overflow:hidden;padding-block:72px 48px;border-bottom:1.5px solid var(--line);margin-bottom:48px}
.hero-bg{position:absolute;inset:0;pointer-events:none;opacity:.16}
.hero-bg svg{width:100%;height:100%}
.hero-num{position:absolute;right:-8px;top:10px;font-family:var(--serif);font-size:clamp(160px,30vw,300px);line-height:1;color:var(--clay);opacity:.14;pointer-events:none}
.hero-inner{position:relative;max-width:720px}
.hero h1{font-size:clamp(38px,6.4vw,62px);line-height:1.05;margin-block:14px 18px}
.hero h1 span{color:var(--clay-ink)}
.dek{font-family:var(--serif);font-size:clamp(18px,2.4vw,22px);line-height:1.45;color:var(--muted);max-width:620px}
.byline{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.04em}

/* Sections */
section{margin-block:64px}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.rule{border:0;border-top:1.5px solid var(--line);margin:14px 0 24px}
.cols{column-gap:44px}
@media (min-width:820px){.cols{column-count:2}.cols p:first-child::first-letter{float:left;font-family:var(--serif);font-size:64px;line-height:.85;padding:6px 8px 0 0;color:var(--clay-ink)}}
.cols p{break-inside:avoid-column}

/* Pull quote */
.pull{margin:40px auto;max-width:760px;text-align:left;border-top:1.5px solid var(--clay);border-bottom:1.5px solid var(--clay);padding-block:22px}
.pull p{font-family:var(--serif);font-size:clamp(21px,3vw,28px);line-height:1.35;margin:0}
.pull cite{display:block;margin-top:10px;font-family:var(--mono);font-size:11.5px;font-style:normal;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}

/* Callouts */
.callout{background:var(--oat);border-radius:12px;padding:20px 22px;margin-block:24px}
.callout h3{font-size:18px;margin-bottom:8px}
.callout p:last-child,.callout ul:last-child{margin-bottom:0}
.callout.warn{background:transparent;border:1.5px solid var(--rust)}
.callout.warn .label{color:var(--rust)}
.callout ul{padding-left:20px;margin:0 0 1em}

/* Float figure */
figure{margin:0}
figcaption{font-size:13px;color:var(--faint);line-height:1.5;margin-top:8px}
svg text{font-family:var(--sans)}

/* Analogy chain */
.chain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-block:28px}
@media (max-width:760px){.chain{grid-template-columns:1fr}}
.chain div{border-top:3px solid var(--clay);padding-top:12px;min-width:0}
.chain div:nth-child(2){border-color:var(--olive)}
.chain div:nth-child(3){border-color:var(--rust)}
.chain p{margin:6px 0 0;font-size:15px}

/* Table */
.tscroll{overflow-x:auto;margin-block:20px}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:520px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel);font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--rust);font-weight:600}
.neg{color:var(--olive);font-weight:600}

/* Evidence chain */
.steps{list-style:none;padding:0;margin:28px 0;display:grid;gap:0}
.step{display:grid;grid-template-columns:56px minmax(0,1fr);gap:18px;position:relative;padding-bottom:26px}
.step:not(:last-child)::before{content:"";position:absolute;left:27px;top:52px;bottom:0;width:1.5px;background:var(--line)}
.step .n{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--clay);display:grid;place-items:center;font-family:var(--serif);font-size:22px;color:var(--clay-ink);background:var(--bg)}
.step h3{font-size:19px;margin-top:4px}
.step .q{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.04em;margin:4px 0 6px}
.step p{margin:0 0 6px;font-size:15px}
.step .ans{display:inline-block;font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel);color:var(--fg)}
.step.key .n{background:var(--clay);color:var(--bg)}

/* Stumbling */
.traps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:24px}
@media (max-width:760px){.traps{grid-template-columns:1fr}}
.trap{border:1.5px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.trap p{margin:6px 0 0;font-size:15px}

/* Stamps */
.stamps{counter-reset:s;display:grid;gap:18px;margin-top:24px}
.stamp{counter-increment:s;display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;align-items:start}
.stamp::before{content:counter(s);font-family:var(--serif);font-size:36px;line-height:1;color:var(--clay-ink)}
.stamp p{font-family:var(--serif);font-size:19px;line-height:1.45;margin:0}

/* MCQ */
.mcq{border:1.5px solid var(--line);border-radius:12px;padding:20px 22px;margin-block:18px;background:var(--card)}
.mcq .stem{margin:8px 0 14px}
.opts{display:grid;gap:8px}
.opt{all:unset;box-sizing:border-box;display:block;cursor:pointer;border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--clay)}
.opt:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.opt.right{border-color:var(--olive);background:color-mix(in srgb,var(--olive) 14%,transparent)}
.opt.wrong{border-color:var(--rust);background:color-mix(in srgb,var(--rust) 12%,transparent)}
.opt b{font-family:var(--mono);font-weight:600;margin-right:8px}
.expl{margin-top:14px;font-size:15px;border-top:1px solid var(--line);padding-top:12px}
.expl ul{padding-left:18px;margin:6px 0}

/* Ref card */
.card{border:1.5px solid var(--fg);border-radius:12px;padding:26px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 32px}
@media (max-width:700px){.card{grid-template-columns:1fr;padding:20px}}
.card .full{grid-column:1/-1}
.card h3{font-size:24px}
.card dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.card dd{margin:2px 0 0;font-size:15px}

/* Speak */
.speak{font-family:var(--serif);font-size:18px;line-height:1.6;max-width:680px}

/* Family */
.family{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.chip{font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line)}
.chip.now{border-color:var(--clay);color:var(--clay-ink)}


/* Summary trio */
.trio{list-style:none;padding:0;margin:8px 0 12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px}
.panel{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:18px 18px 16px;min-width:0}
.panel:nth-child(3){border-color:var(--rust)}
.panel h3{font-size:18px;margin:6px 0 10px}
.panel svg{display:block;width:100%;height:auto;margin:4px 0 10px}
.panel ul{padding-left:18px;margin:0;font-size:14.5px;line-height:1.5}
.panel li+li{margin-top:4px}
.panel:not(:last-child)::after{content:"\2192";position:absolute;right:-26px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--clay)}
.kh{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin:4px 0 6px;font-weight:600}
.kh.ok{color:var(--olive)} .kh.no{color:var(--rust);margin-top:14px}
@media (max-width:860px){.trio{grid-template-columns:1fr;gap:30px}.panel:not(:last-child)::after{content:"\2193";right:auto;left:50%;top:auto;bottom:-29px;transform:translateX(-50%)}}
/* Mechanism grid */
.mech{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 36px;align-items:start}
.mech figure{grid-column:2;grid-row:1 / span 5}
.mech > p{grid-column:1;margin:0}
@media (max-width:860px){.mech{grid-template-columns:1fr}.mech figure{grid-column:1;grid-row:auto;width:100%;max-width:460px;margin:0 auto 8px}.mech > p{grid-column:1}}
.mcq .status{margin-top:10px;font-size:14px;font-weight:600}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--fg)}
/* Footer */
.refs{font-size:13.5px;color:var(--muted)}
.refs ol{padding-left:20px}
.refs li{margin-bottom:8px}
.note{font-size:13px;color:var(--faint)}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .15s,background .15s}}

body{padding:16px} .wrap{padding-block:0 24px}</style></head><body><div class="wrap">
<span class="label">Blood🩸Doctor · Test yourself</span><h2 style="margin:6px 0 4px">JAMA (ISBT 049): four single best answer questions</h2>
<p class="note">Tap an option to see the answer and why the others are wrong.</p><div id="mcqs"></div>
<p class="note">Source: Mankelow TJ et al. Vox Sang 2026. doi:10.1111/vox.70352</p></div>
<script>
const Q = [
  {dom:"Investigation", stem:"A pregnant woman, never transfused, has a moderate-strength antibody reactive by LISS IAT with all panel cells, including a large rare null panel. Her plasma does not react with her own cells, and her brother's red cells are the only other non-reactive cells found. The antibody is resistant to papain, trypsin, pronase and DTT but sensitive to chymotrypsin. Reference serology cannot assign a specificity. What is the most useful next step?",
   opts:["Repeat antibody identification with a larger routine panel","Whole-exome sequencing of the patient and her brother","Direct antiglobulin test on her red cells","Adsorb her plasma with rabbit erythrocyte stroma","Report it as a warm autoantibody"], a:1,
   why:"The sibling pattern points to an inherited absence of a high-prevalence antigen. When serology finds no known specificity, sequencing both affected relatives and filtering for shared homozygous surface-exposed variants in red cell membrane proteins is how JAMA was found.",
   not:["A bigger routine panel cannot help: every cell carries the antigen.","A DAT looks for antibody on her own cells; the problem is an alloantibody against everyone else's.","Rabbit stroma adsorption removes cold antibodies such as anti-I; it will not reveal this specificity.","Her plasma did not react with her own cells, which points to an alloantibody rather than an autoantibody."],
   stamp:"When serology runs out of comparisons, sequence the family."},
  {dom:"Mechanism", stem:"PolyPhen-2 calls F11R p.Arg215Gln benign, SIFT calls it tolerated and AlphaMissense likely benign. Yet it defines the JIMI-negative phenotype. What best explains this?",
   opts:["The prediction tools were wrong about the protein's function","The variant removes JAM-A from the red cell membrane","The tools predict loss of function, not whether a surface change is immunogenic","The variant creates a new glycosylation site","Only heterozygotes can make anti-JIMI"], a:2,
   why:"The change is conservative and the protein keeps its shape, so function-based tools score it as harmless. But the side chain faces the plasma, and a different amino acid on the surface is enough for another person's immune system to see a difference.",
   not:["The siblings' normal blood counts fit with preserved function, though the study did not test JAM-A function directly.","JAM-A is still present on their red cells, only at a lower level.","Nothing in the paper suggests a new glycan; Asn185 glycosylation is at the other end of D2.","The antibody maker is homozygous for Gln215; heterozygotes carry Arg215 and would not make it."],
   stamp:"Benign for the protein is not the same as invisible to the immune system."},
  {dom:"Proof", stem:"Which paired inhibition result most directly shows that the patient's antibody targets residue 215 of JAM-A?",
   opts:["Lower JAM-A expression on the siblings' red cells by flow cytometry","Adsorption of the antibody by control platelets","Arg215 Fc blocks her antibody, Gln215 Fc does not, and a mouse anti-JAM-A is blocked by both","Both siblings share the homozygous F11R variant","The antibody is destroyed by chymotrypsin"], a:2,
   why:"This paired result tests the one amino acid, while the mouse antibody result shows both proteins kept a shared anti-JAM-A epitope. The CHO cell experiment repeats the same answer on whole cells.",
   not:["Lower expression is a secondary finding and does not show what the antibody binds.","Platelet adsorption shows the target sits on platelets, not which residue it is.","A shared variant is an association; it does not prove the antibody binds that protein.","Chymotrypsin sensitivity describes the epitope's behaviour, not its identity."],
   stamp:"Two antibodies, two proteins, one difference: that is the proof."},
  {dom:"Clinical", stem:"A JIMI-negative woman with anti-JIMI is referred in a new pregnancy. Apart from red cell compatibility, which additional issue do the authors say anti-JAM-A antibodies must be considered for?",
   opts:["Heparin-induced thrombocytopenia","Effects on platelets, including fetal and neonatal alloimmune thrombocytopenia","Acquired von Willebrand syndrome","Thrombotic thrombocytopenic purpura","Paroxysmal nocturnal haemoglobinuria"], a:1,
   why:"JAM-A is expressed on platelets and the antibody was adsorbed by and eluted from platelets. The authors say future anti-JAM-A antibodies will need to be considered for effects on red cells and platelets, including FNAIT and platelet or granulocyte transfusion. This is a possibility, not an observed event.",
   not:["HIT is driven by antibodies to PF4 and heparin complexes.","Acquired VWS involves VWF loss, not JAM-A.","TTP is caused by ADAMTS13 deficiency.","PNH comes from loss of GPI-anchored proteins in a clone."],
   stamp:"An antigen on two cell types means two kinds of risk to think about."}
];
const root = document.getElementById('mcqs');
const L = "ABCDE";
Q.forEach((q,i)=>{
  const box = document.createElement('div'); box.className='mcq';
  box.innerHTML = `<span class="label" id="ql${i}">Question ${i+1} · ${q.dom}</span><p class="stem" id="qs${i}">${q.stem}</p><div class="opts" role="group" aria-labelledby="ql${i} qs${i}"></div><p class="status" role="status" aria-live="polite"></p><div class="expl" hidden></div>`;
  const opts = box.querySelector('.opts'), ex = box.querySelector('.expl'), st = box.querySelector('.status');
  q.opts.forEach((t,j)=>{
    const b=document.createElement('button'); b.className='opt'; b.type='button'; b.id=`q${i}o${j}`;
    b.setAttribute('aria-pressed','false');
    b.innerHTML=`<b>${L[j]}</b>${t}`;
    b.addEventListener('click',()=>{
      opts.querySelectorAll('.opt').forEach((o,k)=>{o.classList.remove('right','wrong'); o.setAttribute('aria-pressed', k===j ? 'true':'false'); if(k===q.a)o.classList.add('right');});
      if(j!==q.a) b.classList.add('wrong');
      const others = q.opts.map((o,k)=>k).filter(k=>k!==q.a);
      st.textContent = `You chose ${L[j]}. ${j===q.a ? 'Correct.' : 'Not correct. The answer is '+L[q.a]+'.'}`;
      ex.innerHTML = `<strong>Answer ${L[q.a]}.</strong> ${q.why}<ul>${others.map((k,n)=>`<li><b>${L[k]}:</b> ${q.not[n]}</li>`).join('')}</ul><em>Stamp: ${q.stamp}</em>`;
      ex.hidden=false;
    });
    opts.appendChild(b);
  });
  root.appendChild(box);
});
</script></body></html>
