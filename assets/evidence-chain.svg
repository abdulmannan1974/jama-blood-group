<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Six-step evidence chain from serology to platelet adsorption"><rect width="1200" height="250" fill="#FAF9F5"/><text x="30" y="40" font-size="22" fill="#141413" font-family="Georgia, serif">How JAMA was proved: six steps</text><rect x="30" y="70" width="170" height="140" rx="12" fill="#FFFFFF" stroke="#D1CFC5" stroke-width="2"/><text x="115" y="112" text-anchor="middle" font-size="30" fill="#B85C3E" font-family="Georgia, serif">1</text><text x="115" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#141413">Serology</text><text x="115" y="172" text-anchor="middle" font-size="13" fill="#5E5D57">No known specificity</text><text x="115" y="190" text-anchor="middle" font-size="13" fill="#5E5D57"></text><text x="204" y="148" font-size="20" fill="#D97757">›</text><rect x="223" y="70" width="170" height="140" rx="12" fill="#FFFFFF" stroke="#D1CFC5" stroke-width="2"/><text x="308" y="112" text-anchor="middle" font-size="30" fill="#B85C3E" font-family="Georgia, serif">2</text><text x="308" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#141413">Enzymes</text><text x="308" y="172" text-anchor="middle" font-size="13" fill="#5E5D57">Chymotrypsin-sensitive</text><text x="308" y="190" text-anchor="middle" font-size="13" fill="#5E5D57"></text><text x="397" y="148" font-size="20" fill="#D97757">›</text><rect x="416" y="70" width="170" height="140" rx="12" fill="#FFFFFF" stroke="#D1CFC5" stroke-width="2"/><text x="501" y="112" text-anchor="middle" font-size="30" fill="#B85C3E" font-family="Georgia, serif">3</text><text x="501" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#141413">Exome</text><text x="501" y="172" text-anchor="middle" font-size="13" fill="#5E5D57">F11R p.Arg215Gln</text><text x="501" y="190" text-anchor="middle" font-size="13" fill="#5E5D57"></text><text x="590" y="148" font-size="20" fill="#D97757">›</text><rect x="609" y="70" width="170" height="140" rx="12" fill="#FFFFFF" stroke="#D1CFC5" stroke-width="2"/><text x="694" y="112" text-anchor="middle" font-size="30" fill="#B85C3E" font-family="Georgia, serif">4</text><text x="694" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#141413">Flow</text><text x="694" y="172" text-anchor="middle" font-size="13" fill="#5E5D57">JAM-A on RBCs,</text><text x="694" y="190" text-anchor="middle" font-size="13" fill="#5E5D57">lower in siblings</text><text x="783" y="148" font-size="20" fill="#D97757">›</text><rect x="802" y="70" width="170" height="140" rx="12" fill="#D97757" stroke="#B85C3E" stroke-width="2"/><text x="887" y="112" text-anchor="middle" font-size="30" fill="#FFFFFF" font-family="Georgia, serif">5</text><text x="887" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Recombinant JAM-A</text><text x="887" y="172" text-anchor="middle" font-size="13" fill="#FFFFFF">Arg215 only</text><text x="887" y="190" text-anchor="middle" font-size="13" fill="#FFFFFF"></text><text x="976" y="148" font-size="20" fill="#D97757">›</text><rect x="995" y="70" width="170" height="140" rx="12" fill="#FFFFFF" stroke="#D1CFC5" stroke-width="2"/><text x="1080" y="112" text-anchor="middle" font-size="30" fill="#B85C3E" font-family="Georgia, serif">6</text><text x="1080" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#141413">Platelets</text><text x="1080" y="172" text-anchor="middle" font-size="13" fill="#5E5D57">Adsorbed and eluted</text><text x="1080" y="190" text-anchor="middle" font-size="13" fill="#5E5D57"></text><text x="30" y="238" font-size="12" fill="#87867F">Step 5 is decisive: Arg215 JAM-A inhibited the patient antibody, Gln215 did not, while a mouse anti-JAM-A was inhibited by both. Source: Mankelow et al. Vox Sang 2026.</text></svg>