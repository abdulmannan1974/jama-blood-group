<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="JAMA at a glance: family clue, molecular proof, clinical limits">
<rect width="1200" height="580" fill="#FAF9F5"/>
<text x="30" y="44" font-size="26" fill="#141413" font-family="Georgia, serif">JAMA (ISBT 049): clue, proof and limits</text>
<text x="1170" y="44" text-anchor="end" font-size="13" fill="#87867F">Blood🩸Doctor</text>
<rect x="30" y="70" width="360" height="450" rx="14" fill="#FFFFFF" stroke="#D1CFC5" stroke-width="2"/><text x="52" y="102" font-size="12" letter-spacing="1.5" fill="#B85C3E" font-family="Menlo, Consolas, monospace">1 · THE FAMILY CLUE</text><text x="52" y="130" font-size="20" fill="#141413" font-family="Georgia, serif">Everyone reacts, except two siblings</text>
<circle cx="100" cy="200" r="34" fill="#C9503F"/><circle cx="100" cy="200" r="13" fill="#E9A796"/><text x="100" y="258" text-anchor="middle" font-size="15" fill="#141413">Donor cells</text><text x="100" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#B04A3F">react</text><circle cx="210" cy="200" r="34" fill="#C9503F"/><circle cx="210" cy="200" r="13" fill="#E9A796"/><text x="210" y="258" text-anchor="middle" font-size="15" fill="#141413">Her cells</text><text x="210" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#788C5D">no reaction</text><circle cx="320" cy="200" r="34" fill="#C9503F"/><circle cx="320" cy="200" r="13" fill="#E9A796"/><text x="320" y="258" text-anchor="middle" font-size="15" fill="#141413">Brother's cells</text><text x="320" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#788C5D">no reaction</text>
<circle cx="56" cy="335" r="3" fill="#87867F"/><text x="66" y="340" font-size="14.5" fill="#141413">Pregnant woman, no known transfusion</text><circle cx="56" cy="361" r="3" fill="#87867F"/><text x="66" y="366" font-size="14.5" fill="#141413">Moderate pan-reactive antibody (LISS IAT)</text><circle cx="56" cy="387" r="3" fill="#87867F"/><text x="66" y="392" font-size="14.5" fill="#141413">First investigated in 2013</text><circle cx="56" cy="413" r="3" fill="#87867F"/><text x="66" y="418" font-size="14.5" fill="#141413">Still unresolved by serology in 2020</text>
<path d="M396 295 l14 10 l-14 10 z" fill="#D97757"/>
<rect x="420" y="70" width="360" height="450" rx="14" fill="#FFFFFF" stroke="#D1CFC5" stroke-width="2"/><text x="442" y="102" font-size="12" letter-spacing="1.5" fill="#B85C3E" font-family="Menlo, Consolas, monospace">2 · THE MOLECULAR PROOF</text><text x="442" y="130" font-size="20" fill="#141413" font-family="Georgia, serif">One amino acid on D2 of JAM-A</text>
<rect x="420" y="282" width="360" height="16" fill="#E3DACC"/>
<line x1="530" y1="258" x2="530" y2="300" stroke="#141413" stroke-width="3"/>
<ellipse cx="530" cy="190" rx="30" ry="22" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/><text x="530" y="196" text-anchor="middle" font-size="15" fill="#141413">D1</text>
<ellipse cx="530" cy="238" rx="30" ry="22" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/><text x="530" y="244" text-anchor="middle" font-size="15" fill="#141413">D2</text>
<circle cx="560" cy="238" r="8" fill="#D97757"/><text x="574" y="232" font-size="15" font-weight="700" fill="#B85C3E">R</text>
<text x="530" y="326" text-anchor="middle" font-size="14" fill="#141413">Arg215 · JIMI+</text><line x1="680" y1="258" x2="680" y2="300" stroke="#141413" stroke-width="3"/>
<ellipse cx="680" cy="190" rx="30" ry="22" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/><text x="680" y="196" text-anchor="middle" font-size="15" fill="#141413">D1</text>
<ellipse cx="680" cy="238" rx="30" ry="22" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/><text x="680" y="244" text-anchor="middle" font-size="15" fill="#141413">D2</text>
<circle cx="710" cy="238" r="8" fill="#FFFFFF" stroke="#788C5D" stroke-width="2.5"/><text x="724" y="232" font-size="15" font-weight="700" fill="#788C5D">Q</text>
<text x="680" y="326" text-anchor="middle" font-size="14" fill="#141413">Gln215 · JIMI−</text>
<circle cx="446" cy="365" r="3" fill="#87867F"/><text x="456" y="370" font-size="14.5" fill="#141413">Siblings homozygous F11R c.644G&gt;A</text><circle cx="446" cy="391" r="3" fill="#87867F"/><text x="456" y="396" font-size="14.5" fill="#141413">p.Arg215Gln, exon 6, domain D2</text><circle cx="446" cy="417" r="3" fill="#87867F"/><text x="456" y="422" font-size="14.5" fill="#141413">Arg215 JAM-A inhibited her antibody;</text><circle cx="446" cy="443" r="3" fill="#87867F"/><text x="456" y="448" font-size="14.5" fill="#141413">Gln215 JAM-A did not</text>
<text x="442" y="488" font-size="13.5" font-weight="700" fill="#141413">System JAMA, ISBT 049 · antigen JIMI (JAMA1)</text>
<path d="M786 295 l14 10 l-14 10 z" fill="#D97757"/>
<rect x="810" y="70" width="360" height="450" rx="14" fill="#FFFFFF" stroke="#B04A3F" stroke-width="2"/><text x="832" y="102" font-size="12" letter-spacing="1.5" fill="#B85C3E" font-family="Menlo, Consolas, monospace">3 · THE CLINICAL LIMITS</text><text x="832" y="130" font-size="20" fill="#141413" font-family="Georgia, serif">What was shown, and what was not</text>
<text x="832" y="170" font-size="12" letter-spacing="1.5" font-weight="700" fill="#788C5D" font-family="Menlo, Consolas, monospace">SHOWN</text>
<circle cx="836" cy="193" r="3" fill="#87867F"/><text x="846" y="198" font-size="14.5" fill="#141413">Antibody bound platelets in vitro</text><circle cx="836" cy="219" r="3" fill="#87867F"/><text x="846" y="224" font-size="14.5" fill="#141413">JIMI− cells still carry JAM-A (lower)</text><circle cx="836" cy="245" r="3" fill="#87867F"/><text x="846" y="250" font-size="14.5" fill="#141413">No HDFN in 4 live births (6 pregnancies)</text>
<text x="832" y="300" font-size="12" letter-spacing="1.5" font-weight="700" fill="#B04A3F" font-family="Menlo, Consolas, monospace">NOT SHOWN OR NOT KNOWN</text>
<circle cx="836" cy="323" r="3" fill="#87867F"/><text x="846" y="328" font-size="14.5" fill="#141413">Haemolytic transfusion reactions</text><circle cx="836" cy="349" r="3" fill="#87867F"/><text x="846" y="354" font-size="14.5" fill="#141413">HDFN risk beyond this one family</text><circle cx="836" cy="375" r="3" fill="#87867F"/><text x="846" y="380" font-size="14.5" fill="#141413">Platelet refractoriness or FNAIT</text><circle cx="836" cy="401" r="3" fill="#87867F"/><text x="846" y="406" font-size="14.5" fill="#141413">How common JIMI-negative people are</text>
<text x="30" y="556" font-size="12.5" fill="#87867F">Schematic, not to scale. Source: Mankelow TJ et al. Vox Sang 2026. doi:10.1111/vox.70352 · gnomAD allele frequency 0.0000044 is for the variant allele, not JIMI-negative people.</text>
</svg>